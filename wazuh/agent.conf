<!--
  OT lab: centralised configuration for the IT-side Wazuh agents (mirror-dmz, grafana-it).
  Install on the MANAGER as /var/ossec/etc/shared/default/agent.conf (agents in the "default" group pick it up
  within a few minutes, no agent restart needed), then check it with:  /var/ossec/bin/verify-agent-conf
  Paths that do not exist on an agent are skipped. Real-time FIM uses inotify, which works in LXC.
  Files holding secrets are monitored without content diffs (nodiff), so tokens and keys never reach the SOC.
-->
<agent_config>
  <syscheck>
    <!-- one-way link: receiver code and its environment file (HMAC key, write token) -->
    <directories realtime="yes" check_all="yes">/etc/diode,/opt/diode</directories>

    <!-- Grafana: config, provisioning (data source with the read token), dashboards, service environment -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/grafana,/var/lib/grafana/dashboards,/etc/default/grafana-server</directories>
    <nodiff>/etc/grafana/provisioning/datasources/mirror.yaml</nodiff>
    <nodiff>/etc/default/grafana-server</nodiff>

    <!-- mirror InfluxDB configuration -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/influxdb</directories>

    <!-- service definitions (diode-recv, grafana-server, drop-ins) -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/systemd/system</directories>
  </syscheck>
</agent_config>
